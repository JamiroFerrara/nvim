<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#11111b" />
    <title>org — todos</title>
    <link rel="stylesheet" href="/assets/org.css" />
    <link rel="stylesheet" href="/assets/app.css" />
    <link rel="stylesheet" href="/assets/editor.css" />
    <link rel="stylesheet" href="/assets/graph.css" />
    <link rel="stylesheet" href="/assets/jarvis.css" />
  </head>
  <body>
    <aside id="sidebar">
      <h1>org<span id="live" title="following the vault">●</span></h1>
      <a id="roam-link" href="/roam" title="Roam notes, rendered links and the link graph">
        <span>◈ roam</span>
      </a>
      <input id="search" type="search" placeholder="Filter  /" autocomplete="off" spellcheck="false" />
      <button id="capture-open" type="button" title="Capture a task (c)" aria-label="Capture a task">
        <span class="cap-long">＋ capture</span><span class="cap-short" aria-hidden="true">＋</span><span class="key">c</span>
      </button>
      <nav id="projects"></nav>
      <section id="share" hidden>
        <button id="share-toggle" type="button" title="Show the QR and the phone link">
          <span id="share-label">◲ phone</span>
        </button>
        <div id="share-body">
          <div id="share-qr"></div>
          <a id="share-url" target="_blank" rel="noopener"></a>
          <p id="share-note"></p>
          <div class="row">
            <button id="share-copy" type="button">copy link</button>
            <button id="share-off" type="button">stop</button>
          </div>
        </div>
      </section>
      <footer id="totals"></footer>
    </aside>
    <main>
      <header id="tabs"></header>
      <div id="views"><p class="empty">Loading…</p></div>
    </main>
    <aside id="detail" hidden></aside>
    <div id="cmdline"></div>
    <script src="/assets/org-actions.js"></script>
    <script src="/assets/editor.js"></script>
    <script src="/assets/graph.js"></script>
    <script src="/assets/app.js"></script>
    <script src="/assets/jarvis.js"></script>
  </body>
</html>
