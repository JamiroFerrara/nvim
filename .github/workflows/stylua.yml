# Check Lua Formatting
name: Check Lua Formatting
on: [push, pull_request]

jobs:
  stylua-check:
    name: Stylua Check (changed files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The repo predates the format gate and half its Lua files do not match
      # .stylua.toml, so this ratchets: only the files this change touches are
      # checked. No valid base (first push of a branch) means nothing to compare.
      - name: Collect changed Lua files
        id: changed
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            base='${{ github.event.pull_request.base.sha }}'
          else
            base='${{ github.event.before }}'
          fi
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "list=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          list=$(git diff --name-only --diff-filter=ACM "$base" '${{ github.sha }}' -- '*.lua' | tr '\n' ' ')
          echo "list=$list" >> "$GITHUB_OUTPUT"

      - name: Stylua Check
        if: steps.changed.outputs.list != ''
        uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check -- ${{ steps.changed.outputs.list }}
